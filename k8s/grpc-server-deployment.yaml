# gRPC server (Bookie backend service)
#
# Image: ghcr.io/sadhakbj/bookie-grpc-server
# - Replace `sadhakbj` with your GitHub/Docker username if different.
# - `imagePullPolicy: IfNotPresent` lets OrbStack use a locally built image
#   (docker build -t ghcr.io/sadhakbj/bookie-grpc-server:latest -f Dockerfile.server .)
#   while still pulling from ghcr.io when no local image exists.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grpc-server
  namespace: bookie
  labels:
    app: grpc-server
    app.kubernetes.io/name: grpc-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grpc-server
  template:
    metadata:
      labels:
        app: grpc-server
    spec:
      containers:
        - name: grpc-server
          image: ghcr.io/sadhakbj/bookie-grpc-server:latest
          imagePullPolicy: IfNotPresent
          # Distroless images already run as nonroot (UID 65532); make it explicit
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
          ports:
            - name: grpc
              containerPort: 8020
          env:
            - name: PORT
              value: "8020"
            - name: TZ
              value: UTC
            # Placeholder DB_* until the k8s MySQL manifests land (epic #27,
            # ticket #24, which will move credentials into a Secret). While
            # unreachable, the server logs a warn and keeps serving.
            - name: DB_HOST
              value: mysql.bookie.svc.cluster.local
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              value: bookie
            - name: DB_PASSWORD
              value: bookie
            - name: DB_NAME
              value: bookie
          # Native gRPC health probe (k8s 1.24+) against the standard
          # grpc.health.v1.Health service registered by the server
          readinessProbe:
            grpc:
              port: 8020
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: 8020
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
