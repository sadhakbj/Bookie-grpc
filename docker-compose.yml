services:
  # gRPC Server
  grpc-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: bookie-grpc-server
    restart: unless-stopped
    ports:
      - "8020:8020"
    environment:
      - PORT=8020
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER:-bookie}
      - DB_PASSWORD=${DB_PASSWORD:-bookie}
      - DB_NAME=${DB_NAME:-bookie}
      - TZ=UTC
      - OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4317
      - OTEL_LOGS_OTLP_ENDPOINT=alloy:31081
      - OTEL_METRICS_OTLP_ENDPOINT=prometheus:9090
    networks:
      - bookie-network
    depends_on:
      mysql:
        condition: service_healthy
    # Security options
    security_opt:
      - no-new-privileges:true
    # Read-only root filesystem (best practice for security)
    read_only: true
    # Temporary filesystem for any temp files needed
    tmpfs:
      - /tmp:noexec,nosuid,size=64M
    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    # Health check - external probe approach
    healthcheck:
      test: ["NONE"]
      # For production, use grpc_health_probe or implement health endpoint
      # test: ["CMD", "/grpc_health_probe", "-addr=:8020"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # HTTP Client/BFF
  http-client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: bookie-http-client
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - HTTP_PORT=8080
      - GRPC_SERVER_ADDR=grpc-server:8020
      - TZ=UTC
      - OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4317
      - OTEL_LOGS_OTLP_ENDPOINT=alloy:31081
      - OTEL_METRICS_OTLP_ENDPOINT=prometheus:9090
    networks:
      - bookie-network
    depends_on:
      - grpc-server
    # Security options
    security_opt:
      - no-new-privileges:true
    # Read-only root filesystem
    read_only: true
    # Temporary filesystem for any temp files needed
    tmpfs:
      - /tmp:noexec,nosuid,size=64M
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    # Health check disabled for distroless
    healthcheck:
      test: ["NONE"]
      # For production with proper health endpoint:
      # test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # MySQL 8 (books store; migrations via make migrate-up)
  mysql:
    image: mysql:8.4
    container_name: bookie-mysql
    restart: unless-stopped
    # Match accounts by client IP ('bookie'@'%') — reverse DNS on the
    # Docker bridge makes host-originated connections look like 'localhost'.
    command: --skip-name-resolve
    ports:
      - "${DB_PORT:-3306}:3306"
    # DB_* come from .env (docker-compose reads it); MYSQL_* bootstrap the
    # database inside the container.
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=${DB_NAME:-bookie}
      - MYSQL_USER=${DB_USER:-bookie}
      - MYSQL_PASSWORD=${DB_PASSWORD:-bookie}
      - TZ=UTC
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - bookie-network
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

# --- Observability stack ---
  jaeger:
    image: jaegertracing/all-in-one:1.68.0
    container_name: bookie-jaeger
    restart: unless-stopped
    ports:
      - "4317:4317"   # OTLP gRPC receiver (traces + metrics + logs)
      - "16686:16686" # Jaeger UI
    networks:
      - bookie-network

  prometheus:
    image: prom/prometheus:v3.8.1
    container_name: bookie-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-otlp-receiver
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - bookie-network

  loki:
    image: grafana/loki:3.6.4
    container_name: bookie-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
    ports:
      - "3100:3100"
    networks:
      - bookie-network

  alloy:
    image: grafana/alloy:v1.11.0
    container_name: bookie-alloy
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
    depends_on:
      - loki
      - jaeger
      - prometheus
    ports:
      - "12345:12345"
      - "31081:31081"
    networks:
      - bookie-network

  grafana:
    image: grafana/grafana:12.1.3
    container_name: bookie-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/grpc-red.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - jaeger
    ports:
      - "3000:3000"
    networks:
      - bookie-network

networks:
  bookie-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

volumes:
  mysql-data:
